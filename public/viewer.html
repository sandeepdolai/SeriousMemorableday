<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f1e9"><meta property="og:type" content="website"><title>A little love story</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@500;600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#312a25;--muted:#756b63;--paper:#f7f1e9;--paper2:#efe5da;--accent:#9e655d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#fffaf5,#efe5da 65%,#e8ddd1);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}.page{min-height:100vh;display:grid;place-items:center;padding:28px 18px}.story{width:min(100%,1020px);display:grid;grid-template-columns:.82fr 1.18fr;background:rgba(250,245,239,.72);box-shadow:0 35px 90px rgba(62,43,32,.18);border:1px solid rgba(112,86,68,.12);border-radius:28px;overflow:hidden}.copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:space-between;min-height:720px}.tiny{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600}.names{font-family:"Playfair Display",serif;font-size:clamp(54px,8vw,86px);line-height:.9;letter-spacing:-.055em;margin:28px 0 18px}.names em{font-size:.45em;display:inline-block;transform:translateY(-10px);font-style:italic;color:var(--accent)}.date{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.note{font-family:"Playfair Display",serif;font-size:22px;line-height:1.45;max-width:430px;margin-top:34px}.signature{font-size:11px;color:#84776d;letter-spacing:.08em}.gallery{padding:18px;background:linear-gradient(145deg,#e9dfd5,#f4ece3);display:grid;grid-template-rows:1.4fr .9fr;gap:18px}.hero{border-radius:20px;overflow:hidden;background:#d8cec4;min-height:0}.hero img,.secondary img{width:100%;height:100%;object-fit:cover;display:block}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tile{border-radius:20px;overflow:hidden;background:#d8cec4;min-height:0}.placeholder{height:100%;display:grid;place-items:center;padding:24px;text-align:center;color:#81756d}.heart{margin-top:22px;font-size:18px;color:var(--accent)}.empty{font-family:"Playfair Display",serif;font-size:24px;text-align:center;padding:60px}.loading{opacity:.65}
@media(max-width:820px){.story{grid-template-columns:1fr}.copy{min-height:auto;padding:34px}.gallery{min-height:520px}.names{font-size:60px}.note{font-size:20px}.signature{margin-top:44px}}
</style>
</head><body><main class="page"><article class="story loading" id="story"><section class="copy"><div><div class="tiny">for two hearts</div><div class="names"><span id="nameA">Alex</span> <em>×</em> <span id="nameB">Jamie</span></div><div class="date" id="date">A day to remember</div><div class="note" id="caption">A tiny chapter of a very big love.</div><div class="heart">♥</div></div><div class="signature">A memory worth revisiting.</div></section><section class="gallery"><div class="hero" id="hero"><div class="placeholder">One favorite memory.</div></div><div class="secondary"><div class="tile" id="tile2"><div class="placeholder">Another moment.</div></div><div class="tile"><div class="placeholder">Still together, still becoming.</div></div></div></section></article></main>
<script>
const username=location.pathname.slice(1);async function start(){try{const r=await fetch('/api/templates/'+encodeURIComponent(username));if(!r.ok)throw new Error();const t=await r.json();document.title=`${t.nameA} & ${t.nameB}`;document.getElementById('nameA').textContent=t.nameA;document.getElementById('nameB').textContent=t.nameB;document.getElementById('date').textContent=t.date;document.getElementById('caption').textContent=t.caption;if(t.photo1){document.getElementById('hero').innerHTML=`<img src="${t.photo1}" alt="A favorite memory">`}if(t.photo2){document.getElementById('tile2').innerHTML=`<img src="${t.photo2}" alt="Another favorite memory">`}document.getElementById('story').classList.remove('loading')}catch{document.querySelector('.story').innerHTML='<div class="empty">This little page has disappeared into the universe.<div class="heart">♥</div></div>';}}
start();
</script></body></html>
